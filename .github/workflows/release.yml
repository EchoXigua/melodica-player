name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            target: portable
            extension: exe
          # macOS builds temporarily disabled — re-enable by uncommenting these two entries
          # and reverting the artifact-count/glob changes in the release job below.
          # - name: macOS Apple Silicon
          #   os: macos-15
          #   platform: mac
          #   arch: arm64
          #   target: dmg
          #   extension: dmg
          # - name: macOS Intel
          #   os: macos-15-intel
          #   platform: mac
          #   arch: x64
          #   target: dmg
          #   extension: dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Check release version
        shell: bash
        run: |
          node -e 'const v=require("./package.json").version; if(process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${v}`) throw Error("Tag must match package.json version: v"+v)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm native:mac
      - run: pnpm build
      - name: Package application
        run: pnpm exec electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: melodica-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: melodica-*
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: macOS builds are temporarily disabled in the matrix above, so only the
          # Windows artifact is expected here. Restore to `-eq 3` and `*.exe *.dmg` once
          # macOS is re-enabled.
          test "$(find installers -maxdepth 1 -type f | wc -l)" -eq 1
          (cd installers && sha256sum *.exe > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft > release-status.json 2>/dev/null; then
            node -e 'if(!require("./release-status.json").isDraft) throw Error("This version is already published; create a new version tag.")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Melodica Studio $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
